<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The E.Kemper Tri-series</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --green:#1F6B3E; --green-dark:#123F27; --green-soft:#E3EFE6;
    --red:#C8202F; --red-soft:#FBE4E6;
    --gold:#C98A22; --gold-soft:#F8EDD6;
    --cream:#F5F0E3; --paper:#FFFDF8;
    --ink:#16211A; --ink-soft:#4C5A50;
    --line: rgba(22,33,26,0.14);
    --shadow: 0 10px 26px rgba(16,25,20,0.10);
    --radius-s:7px; --radius-m:13px; --radius-l:22px;
    --font-display:'Anton',Impact,'Arial Narrow',sans-serif;
    --font-body:'Inter',system-ui,-apple-system,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',monospace;
    --bg:var(--cream); --surface:var(--paper); --surface-2:var(--green-soft);
    --text:var(--ink); --text-soft:var(--ink-soft);
    --accent:var(--green); --accent-ink:#ffffff;
    --accent2:var(--red); --accent3:var(--gold);
    --border:var(--line);
    --win:#1F6B3E; --loss:#8A8378; --tie:#C98A22; --live:#C8202F;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D1420; --surface:#141F32; --surface-2:#17301F;
      --text:#F2EFE3; --text-soft:#AEB8C2;
      --accent:#42B074; --accent-ink:#08130C;
      --accent2:#FF6B6F; --accent3:#E3B25E;
      --border:rgba(242,239,227,0.14);
      --shadow: 0 14px 30px rgba(0,0,0,0.5);
      --win:#42B074; --loss:#7E8896; --tie:#E3B25E; --live:#FF6B6F;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D1420; --surface:#141F32; --surface-2:#17301F;
    --text:#F2EFE3; --text-soft:#AEB8C2;
    --accent:#42B074; --accent-ink:#08130C;
    --accent2:#FF6B6F; --accent3:#E3B25E;
    --border:rgba(242,239,227,0.14);
    --shadow: 0 14px 30px rgba(0,0,0,0.5);
    --win:#42B074; --loss:#7E8896; --tie:#E3B25E; --live:#FF6B6F;
  }
  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  :root{
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font-body); font-size:16px; line-height:1.5;
    padding-inline:16px;
  }
  a{color:inherit;}
  h1,h2,h3{font-family:var(--font-display); font-weight:400; letter-spacing:0.01em; text-wrap:balance; margin:0;}
  .mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  #app{max-width:1080px; margin:0 auto; padding-bottom:56px;}
  .eyebrow{font-family:var(--font-mono); font-size:11.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-soft);}

  /* ---------- topbar & tabs ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding-block:18px 10px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .crest{
    width:42px; height:42px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-size:20px; flex:none;
    box-shadow: inset 0 0 0 3px var(--bg), inset 0 0 0 4px var(--accent);
  }
  .brand h1{font-size:22px; line-height:1;}
  .brand .sub{font-size:11.5px; color:var(--text-soft); font-family:var(--font-mono); letter-spacing:0.08em; text-transform:uppercase;}
  .topbar-actions{display:flex; align-items:center; gap:8px;}
  .pill{
    display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:99px;
    font-size:12px; font-weight:600; border:1px solid var(--border); background:var(--surface); color:var(--text-soft);
  }
  .pill .dot{width:7px; height:7px; border-radius:50%; background:var(--text-soft);}
  .pill.on .dot{background:var(--win);}
  .btn{
    font-family:var(--font-body); font-weight:700; font-size:13px; border-radius:99px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); padding:8px 14px; cursor:pointer; transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover{box-shadow:var(--shadow);}
  .btn:active{transform:translateY(1px);}
  .btn-accent{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
  .btn-outline-accent{background:transparent; color:var(--accent); border-color:var(--accent);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn-small{padding:5px 10px; font-size:11.5px;}

  nav.tabs{
    display:flex; gap:4px; overflow-x:auto; border-bottom:2px solid var(--border); padding-bottom:0;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    font-family:var(--font-display); font-weight:400; font-size:15px; letter-spacing:0.02em;
    background:none; border:none; color:var(--text-soft); padding:10px 14px 12px; cursor:pointer; white-space:nowrap;
    border-bottom:3px solid transparent; margin-bottom:-2px;
  }
  .tab-btn.active{color:var(--text); border-bottom-color:var(--accent2);}
  main{padding-top:22px;}
  .tab-panel[hidden]{display:none;}

  /* ---------- generic layout ---------- */
  .stack{display:flex; flex-direction:column; gap:16px;}
  .grid{display:grid; gap:14px;}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:720px){ .grid.cols-3{grid-template-columns:1fr;} .grid.cols-2{grid-template-columns:1fr;} }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
    padding:16px; box-shadow:var(--shadow);
  }
  .card h3{font-size:17px; margin-bottom:8px;}
  .card-flush{padding:0; overflow:hidden;}
  .section-title{display:flex; align-items:baseline; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .section-title h2{font-size:26px;}
  .muted{color:var(--text-soft); font-size:13.5px;}
  hr.rule{border:none; border-top:1px dashed var(--border); margin:14px 0;}

  /* ---------- hero ---------- */
  .hero{
    border-radius:var(--radius-l); padding:30px 24px; position:relative; overflow:hidden; color:#fff;
    background:
      radial-gradient(120% 160% at 15% -10%, rgba(255,255,255,0.16), transparent 55%),
      radial-gradient(90% 140% at 100% 120%, rgba(200,32,47,0.55), transparent 60%),
      linear-gradient(160deg, var(--green-dark), #0F2C1B 70%);
  }
  :root[data-theme="dark"] .hero, @media (prefers-color-scheme:dark){ .hero{ } }
  .hero .eyebrow{color:rgba(255,255,255,0.75);}
  .hero h1{font-size:clamp(34px,7vw,58px); color:#fff; line-height:0.98;}
  .hero .tagline{font-size:15px; color:rgba(255,255,255,0.88); margin-top:8px; max-width:60ch;}
  .hero-meta{display:flex; gap:22px; flex-wrap:wrap; margin-top:20px;}
  .hero-meta .item{font-family:var(--font-mono);}
  .hero-meta .item b{display:block; font-size:19px; color:#fff;}
  .hero-meta .item span{font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.7);}
  .status-strip{margin-top:18px; display:flex; gap:10px; flex-wrap:wrap;}
  .status-chip{
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); color:#fff;
    padding:7px 13px; border-radius:99px; font-size:12.5px; font-weight:600; display:flex; gap:7px; align-items:center;
  }
  .status-chip.live{background:rgba(200,32,47,0.35); border-color:rgba(255,255,255,0.4);}

  .countdown{display:flex; gap:10px; margin-top:6px;}
  .countdown .box{background:rgba(0,0,0,0.28); border:1px solid rgba(255,255,255,0.2); border-radius:var(--radius-s); padding:8px 10px; min-width:56px; text-align:center;}
  .countdown .box b{display:block; font-family:var(--font-mono); font-size:20px;}
  .countdown .box span{font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.7);}

  .team-chip{display:inline-flex; align-items:center; gap:7px; font-weight:700; font-size:13.5px;}
  .team-dot{width:11px; height:11px; border-radius:3px; flex:none;}

  /* ---------- tables ---------- */
  table.table{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.table th, table.table td{padding:10px 10px; text-align:left; border-bottom:1px solid var(--border);}
  table.table th{font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-soft); font-weight:600;}
  table.table td.num, table.table th.num{text-align:right; font-family:var(--font-mono);}
  table.table tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;}
  .rank-1 td:first-child{color:var(--accent2); font-weight:800;}

  /* ---------- schedule ---------- */
  .day-group h3{font-size:19px; margin:6px 0 10px;}
  .match-card{border-left:4px solid var(--accent3);}
  .match-card.completed{border-left-color:var(--win);}
  .match-card.live{border-left-color:var(--live);}
  .match-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
  .match-teams{font-family:var(--font-display); font-size:19px; letter-spacing:0.01em;}
  .match-time{font-family:var(--font-mono); font-size:12.5px; color:var(--text-soft);}
  .match-status{font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; padding:3px 9px; border-radius:99px;}
  .match-status.upcoming{background:var(--gold-soft); color:var(--gold);}
  .match-status.live{background:var(--red-soft); color:var(--red);}
  .match-status.completed{background:var(--green-soft); color:var(--green);}
  .score-line{font-family:var(--font-mono); font-size:14px; margin-top:8px; display:flex; gap:18px; flex-wrap:wrap;}
  .score-line b{font-size:15px;}
  .result-note{margin-top:6px; font-size:13px; color:var(--text-soft); font-style:italic;}
  .final-badge{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent2); font-weight:700;}
  .event-card{border-left:4px solid var(--gold); background:var(--gold-soft);}
  :root[data-theme="dark"] .event-card{ background:rgba(227,178,94,0.14); }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .event-card{ background:rgba(227,178,94,0.14); } }
  .event-card .match-teams{font-size:18px;}
  .event-meta{font-size:13.5px; color:var(--text-soft); margin-top:6px; display:flex; gap:16px; flex-wrap:wrap;}

  /* ---------- badges/stat tiles ---------- */
  .stat-tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:14px; box-shadow:var(--shadow);}
  .stat-tile .v{font-family:var(--font-display); font-size:30px; line-height:1; color:var(--accent);}
  .stat-tile .l{font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-soft); margin-top:4px;}
  .sample-banner{
    background:var(--gold-soft); color:#7A5416; border:1px dashed var(--gold); border-radius:var(--radius-s);
    padding:9px 13px; font-size:12.5px; font-weight:600; display:flex; gap:8px; align-items:center;
  }
  :root[data-theme="dark"] .sample-banner{ color:#F0D9A6; }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .sample-banner{ color:#F0D9A6; } }

  /* ---------- forms / organizer ---------- */
  .organizer-zone{border:1px dashed var(--accent2); border-radius:var(--radius-m); padding:12px; background:color-mix(in srgb, var(--accent2) 6%, transparent);}
  details.edit-panel summary{
    cursor:pointer; font-size:12.5px; font-weight:700; color:var(--accent2); list-style:none; display:inline-flex; gap:5px; align-items:center;
  }
  details.edit-panel summary::-webkit-details-marker{display:none;}
  details.edit-panel[open] summary{margin-bottom:10px;}
  .form-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  @media (max-width:560px){ .form-grid{grid-template-columns:1fr;} }
  label.field{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--text-soft); font-weight:600;}
  input, select, textarea{
    font-family:var(--font-body); font-size:14px; padding:8px 10px; border-radius:var(--radius-s);
    border:1px solid var(--border); background:var(--bg); color:var(--text); width:100%;
  }
  textarea{resize:vertical; min-height:56px;}
  .field-span2{grid-column:1/-1;}
  .form-actions{display:flex; gap:8px; margin-top:10px;}

  /* ---------- rules ---------- */
  .rule-card{display:flex; gap:14px;}
  .rule-num{font-family:var(--font-display); font-size:30px; color:var(--accent3); flex:none; width:44px;}
  .rule-card h3{font-size:16.5px; margin-bottom:4px;}
  .rule-card p{margin:0; font-size:14px; color:var(--text-soft);}
  .points-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  @media (max-width:640px){ .points-grid{grid-template-columns:repeat(2,1fr);} }
  .point-tile{text-align:center; padding:14px 8px; border-radius:var(--radius-m); background:var(--surface-2); border:1px solid var(--border);}
  .point-tile b{font-family:var(--font-display); font-size:22px; display:block;}


  /* ---------- ceremony ---------- */
  .award-card{text-align:center; padding:22px 14px;}
  .award-card .icon{font-size:30px;}
  .award-card .role{font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-soft); margin:8px 0 4px;}
  .award-card .name{font-family:var(--font-display); font-size:24px;}
  .award-card .name.empty{color:var(--text-soft); font-family:var(--font-body); font-size:15px; font-style:italic;}
  .celebration-photo{width:100%; border-radius:var(--radius-m); display:block; object-fit:cover; max-height:340px;}
  .celebration-placeholder{
    border:2px dashed var(--border); border-radius:var(--radius-m); padding:40px 16px; text-align:center; color:var(--text-soft);
  }
  .final-message{
    text-align:center; padding:34px 20px; border-radius:var(--radius-l); margin-top:8px;
    background:linear-gradient(160deg, var(--green-dark), #0F2C1B 70%); color:#fff;
  }
  .final-message h2{color:#fff; font-size:clamp(24px,5vw,36px);}
  .final-message p{color:rgba(255,255,255,0.85); max-width:52ch; margin:10px auto 0; font-size:14.5px;}

  footer.site-footer{text-align:center; margin-top:30px; font-size:12px; color:var(--text-soft);}
  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:10px 16px; border-radius:99px; font-size:13px; font-weight:600; box-shadow:var(--shadow); z-index:50;
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
  .organizer-fab{
    position:fixed; right:14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    width:26px; height:26px; border-radius:50%; z-index:40;
    border:1px solid var(--border); background:var(--surface); color:var(--text-soft);
    font-size:12px; line-height:1; display:flex; align-items:center; justify-content:center;
    cursor:pointer; opacity:.28; transition:opacity .15s ease, background .15s ease, color .15s ease;
  }
  .organizer-fab:hover, .organizer-fab:focus-visible{ opacity:.9; }
  .organizer-fab.active{ opacity:1; background:var(--accent2); color:#fff; border-color:transparent; }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="crest">🏏</div>
      <div>
        <h1>KEMPER TRI-SERIES</h1>
        <div class="sub">Internal Cricket Tournament</div>
      </div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab-btn" data-tab="home">🏏 Home</button>
    <button class="tab-btn" data-tab="schedule">📅 Schedule</button>
    <button class="tab-btn" data-tab="rules">📜 Rules</button>
    <button class="tab-btn" data-tab="stats">📊 Statistics</button>
    <button class="tab-btn" data-tab="survey">📝 Survey</button>
    <button class="tab-btn" data-tab="ceremony">🏆 Ceremony</button>
  </nav>

  <main>
    <section id="tab-home" class="tab-panel"></section>
    <section id="tab-schedule" class="tab-panel" hidden></section>
    <section id="tab-rules" class="tab-panel" hidden></section>
    <section id="tab-stats" class="tab-panel" hidden></section>
    <section id="tab-survey" class="tab-panel" hidden></section>
    <section id="tab-ceremony" class="tab-panel" hidden></section>
  </main>

  <footer class="site-footer">Kemper Cricket Tournament · organized by people who take the cricket seriously, not themselves.</footer>
</div>
<div class="toast" id="toast"></div>
<button id="organizerFab" class="organizer-fab" title="Organizer" aria-label="Toggle organizer editing">⚙</button>

<script>
(function(){
  "use strict";

  /* ============================= DEFAULT / SEED DATA ============================= */
  var DEFAULT_DATA = {
    meta: {
      dates: "Oct 3–4, 2026",
      venue: "E.KEMPER",
      isSample: true
    },
    teams: [
      { id:"A", name:"Team A", color:"#1F6B3E" },
      { id:"B", name:"Team B", color:"#C8202F" },
      { id:"C", name:"Team C", color:"#C98A22" }
    ],
    schedule: [
      { id:"m1", label:"Match 1", datetime:"2026-10-03T08:00", teamA:"A", teamB:"B", isFinal:false, status:"upcoming", result:null },
      { id:"m2", label:"Match 2", datetime:"2026-10-03T10:30", teamA:"C", teamB:"A", isFinal:false, status:"upcoming", result:null },
      { id:"m4", label:"Match 4", datetime:"2026-10-04T08:00", teamA:"C", teamB:"B", isFinal:false, status:"upcoming", result:null },
      { id:"final", label:"Final", datetime:"2026-10-04T10:30", teamA:"", teamB:"", isFinal:true, status:"upcoming", result:null },
      { id:"celebration", type:"event", label:"Post-Match Celebration", datetime:"2026-10-04T13:00", location:"TBD", description:"Beer + Biryani + Prizes*" }
    ],
    players: [
      { id:"p1", name:"A. Sharma (sample)", team:"A", matches:2, runs:88, wickets:1, ducks:0 },
      { id:"p2", name:"R. Iyer (sample)", team:"B", matches:2, runs:45, wickets:3, ducks:1 },
      { id:"p3", name:"K. Patel (sample)", team:"C", matches:1, runs:20, wickets:2, ducks:0 }
    ],
    highlights: { bestBatting:"62* (18 balls) — A. Sharma vs Team B (sample)", bestBowling:"3/12 (3 overs) — R. Iyer vs Team C (sample)" },
    ceremony: { champion:"", runnerUp:"", playerOfTournament:"", bestBatter:"", bestBowler:"", goldenDuckChampion:"", captainsExcuse:"", celebrationNote:"", celebrationPhoto:null }
  };

  var SURVEY_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSewdifkETVeSmUoU1cxrEXckkisEWMg6-5qdAYjSZgLFdo8xw/viewform";

  /* ============================= STATE ============================= */
  var data = clone(DEFAULT_DATA);
  var db = null, userCap = null, assetsCap = null;
  var myId = null, canEdit = false, isOwner = false, liveMode = false;
  var organizerMode = false;

  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function byId(arr, id){ for (var i=0;i<arr.length;i++) if (arr[i].id===id) return arr[i]; return null; }
  function teamName(id){ var t = byId(data.teams, id); return t ? t.name : (id || "TBD"); }
  function teamColor(id){ var t = byId(data.teams, id); return t ? t.color : "#8A8378"; }
  function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(showToast._h);
    showToast._h = setTimeout(function(){ t.classList.remove('show'); }, 2600);
  }

  /* ============================= TABS ============================= */
  var TABS = ["home","schedule","rules","stats","survey","ceremony"];
  function setTab(name){
    if (TABS.indexOf(name) === -1) name = "home";
    TABS.forEach(function(t){
      document.getElementById('tab-'+t).hidden = (t !== name);
    });
    document.querySelectorAll('.tab-btn').forEach(function(b){
      b.classList.toggle('active', b.dataset.tab === name);
    });
    if (location.hash.slice(1) !== name) history.replaceState(null,"","#"+name);
  }
  document.querySelectorAll('.tab-btn').forEach(function(b){
    b.addEventListener('click', function(){ setTab(b.dataset.tab); });
  });
  window.addEventListener('hashchange', function(){ setTab(location.hash.slice(1)); });

  /* ============================= STANDINGS ============================= */
  function computeStandings(){
    var rows = {};
    data.teams.forEach(function(t){
      rows[t.id] = { id:t.id, name:t.name, color:t.color, played:0, won:0, lost:0, tied:0, points:0, runsFor:0, oversFor:0, runsAgainst:0, oversAgainst:0 };
    });
    data.schedule.forEach(function(m){
      if (m.status !== 'completed' || !m.result || !m.teamA || !m.teamB) return;
      var a = rows[m.teamA], b = rows[m.teamB];
      if (!a || !b) return;
      var ra = m.result.teamAScore || {runs:0,overs:0}, rb = m.result.teamBScore || {runs:0,overs:0};
      a.played++; b.played++;
      a.runsFor += num(ra.runs); a.oversFor += num(ra.overs); a.runsAgainst += num(rb.runs); a.oversAgainst += num(rb.overs);
      b.runsFor += num(rb.runs); b.oversFor += num(rb.overs); b.runsAgainst += num(ra.runs); b.oversAgainst += num(ra.overs);
      if (m.result.winner === 'tie') { a.tied++; b.tied++; a.points += 1; b.points += 1; }
      else if (m.result.winner === m.teamA) { a.won++; a.points += 2; b.lost++; }
      else if (m.result.winner === m.teamB) { b.won++; b.points += 2; a.lost++; }
    });
    var list = Object.keys(rows).map(function(k){
      var r = rows[k];
      var nrrFor = r.oversFor > 0 ? r.runsFor / r.oversFor : 0;
      var nrrAgainst = r.oversAgainst > 0 ? r.runsAgainst / r.oversAgainst : 0;
      r.nrr = nrrFor - nrrAgainst;
      return r;
    });
    list.sort(function(x,y){ return y.points - x.points || y.nrr - x.nrr; });
    return list;

    if (live.length) return live[0];

  function startCountdown(nm){

      var diff = new Date(nm.datetime).getTime() - Date.now();
      if (diff <= 0){ box.innerHTML = '<span style="color:#fff; font-weight:700;">'+(nm.status==='live' ? 'In progress' : 'Starting now') +'</span>'; return; }
      var d = Math.floor(diff/86400000), h = Math.floor(diff%86400000/3600000), m = Math.floor(diff%3600000/60000), s = Math.floor(diff%60000/1000);
      box.innerHTML =
        '<div class="box"><b class="mono">'+d+'</b><span>days</span></div>'+
        '<div class="box"><b class="mono">'+pad(h)+'</b><span>hrs</span></div>'+
        '<div class="box"><b class="mono">'+pad(m)+'</b><span>min</span></div>'+
        '<div class="box"><b class="mono">'+pad(s)+'</b><span>sec</span></div>';

  function groupByDay(schedule){
    var groups = {}, order = [];
    schedule.forEach(function(m){
      var day = m.datetime ? new Date(m.datetime).toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' }) : 'Unscheduled';
      if (!groups[day]){ groups[day] = []; order.push(day); }
      groups[day].push(m);
    });
    order.sort(function(a,b){
      var ga = groups[a][0], gb = groups[b][0];
      return (ga.datetime ? new Date(ga.datetime) : 0) - (gb.datetime ? new Date(gb.datetime) : 0);
    });
    return order.map(function(d){ return { day:d, matches:groups[d] }; });
  }

    if (!players.length) html += '<tr><td colspan="6" class="muted">No players yet.</td></tr>';
    players.forEach(function(p){
      html += '<tr><td>'+escapeHtml(p.name)+ (organizerMode?('<div>'+playerEditRow(p)+'</div>'):'') +'</td><td><span class="team-chip"><span class="team-dot" style="background:'+teamColor(p.team)+'"></span>'+escapeHtml(teamName(p.team))+'</span></td><td class="num">'+p.matches+'</td><td class="num">'+p.runs+'</td><td class="num">'+p.wickets+'</td><td class="num">'+p.ducks+'</td></tr>';
    });
    html += '</tbody></table></div>';
    if (organizerMode){
      html += '<div style="padding:0 16px 16px"><details class="edit-panel"><summary>➕ Add player</summary><form id="addPlayerForm" onsubmit="return false;"><div class="form-grid">';
      html += '<label class="field">Name<input name="name"></label>';
      html += '<label class="field">Team<select name="team">'+teamOptions(null,false)+'</select></label>';
      html += '<label class="field">Matches<input type="number" name="matches" value="0"></label>';
      html += '<label class="field">Runs<input type="number" name="runs" value="0"></label>';
      html += '<label class="field">Wickets<input type="number" name="wickets" value="0"></label>';
      html += '<label class="field">Golden Ducks<input type="number" name="ducks" value="0"></label>';
      html += '</div><div class="form-actions"><button class="btn btn-accent" type="button" data-action="add-player">Add player</button></div></form></details></div>';
    }
    html += '</div>';

    document.getElementById('tab-stats').innerHTML = html;
  }
  function highlightEditField(key, val){
    return '<div style="margin-top:8px"><input data-highlight="'+key+'" value="'+escapeHtml(val||'')+'" placeholder="e.g. 45 (22 balls) — Player vs Team"></div>';
  }

  /* ============================= RENDER: SURVEY ============================= */
  function renderSurvey(){
    var html = '';
    html += '<div class="section-title"><h2>📝 What Matters Most to You?</h2></div>';
    html += '<p class="muted">Quick, anonymous, takes 10 seconds. Fill it out below or open it in a new tab.</p>';
    html += '<div class="card card-flush">';
    html += '<iframe src="'+SURVEY_FORM_URL+'?embedded=true" width="100%" height="900" frameborder="0" marginheight="0" marginwidth="0" style="display:block; border-radius:var(--radius-m);">Loading survey…</iframe>';
    html += '</div>';
    html += '<div class="form-actions" style="margin-top:12px"><a class="btn btn-outline-accent" href="'+SURVEY_FORM_URL+'" target="_blank" rel="noopener">Open survey in a new tab ↗</a></div>';
    html += '<p class="muted" style="margin-top:14px">Organizers: view live results anytime in the Google Form’s <b>Responses</b> tab (Summary view gives you the pie/bar charts).</p>';
    document.getElementById('tab-survey').innerHTML = html;
  }

  /* ============================= RENDER: CEREMONY ============================= */
  function awardCard(icon, role, name){
    return '<div class="card award-card"><div class="icon">'+icon+'</div><div class="role">'+role+'</div><div class="name '+(name?'':'empty')+'">'+(name?escapeHtml(name):'To be announced')+'</div></div>';
  }
  function renderCeremony(){
    var c = data.ceremony;
    var html = '';
    html += '<div class="section-title"><h2>🏆 Ceremony</h2></div>';
    html += '<div class="grid cols-3">';
    html += awardCard('🥇','Tournament Champion', c.champion);
    html += awardCard('🥈','Runner-Up', c.runnerUp);
    html += awardCard('🏏','Player of the Tournament', c.playerOfTournament);
    html += awardCard('🏆','Best Batter', c.bestBatter);
    html += awardCard('🎯','Best Bowler', c.bestBowler);
    html += awardCard('🦆','Golden Duck Champion', c.goldenDuckChampion);
    html += '</div>';

    html += '<div class="card" style="margin-top:14px"><div class="award-card" style="padding:14px 0 0"><div class="icon">😂</div><div class="role">Captain\'s Excuse of the Tournament</div><div class="name '+(c.captainsExcuse?'':'empty')+'" style="font-size:18px">'+(c.captainsExcuse?('"'+escapeHtml(c.captainsExcuse)+'"'):'To be announced')+'</div></div></div>';

    html += '<div class="card" style="margin-top:16px"><h3>📸 Post-Match Celebration</h3>';
    if (c.celebrationPhoto && c.celebrationPhoto.url){
      html += '<img class="celebration-photo" src="'+c.celebrationPhoto.url+'" alt="Post-match celebration">';
    } else {
      html += '<div class="celebration-placeholder">Photos from the winning ceremony go here 🍗🏆<br><span style="font-size:12px">(Beer + Biryani not pictured, but assumed present)</span></div>';
    }
    if (c.celebrationNote) html += '<p class="muted" style="margin-top:10px">'+escapeHtml(c.celebrationNote)+'</p>';
    html += '</div>';

    if (organizerMode){
      html += '<div class="organizer-zone" style="margin-top:16px"><details class="edit-panel" open><summary>✏️ Edit ceremony winners</summary>';
      html += '<form id="ceremonyForm" onsubmit="return false;"><div class="form-grid">';
      ['champion','runnerUp','playerOfTournament','bestBatter','bestBowler','goldenDuckChampion'].forEach(function(k){
        var labels = { champion:'Champion team', runnerUp:'Runner-up team', playerOfTournament:'Player of the Tournament', bestBatter:'Best Batter', bestBowler:'Best Bowler', goldenDuckChampion:'Golden Duck Champion' };
        html += '<label class="field">'+labels[k]+'<input name="'+k+'" value="'+escapeHtml(c[k]||'')+'"></label>';
      });
      html += '<label class="field field-span2">Captain\'s excuse of the tournament<input name="captainsExcuse" value="'+escapeHtml(c.captainsExcuse||'')+'"></label>';
      html += '<label class="field field-span2">Celebration caption<textarea name="celebrationNote">'+escapeHtml(c.celebrationNote||'')+'</textarea></label>';
      html += '<label class="field field-span2">Celebration photo<input type="file" id="celebrationPhotoInput" accept="image/*"></label>';
      html += '</div><div class="form-actions"><button class="btn btn-accent" type="button" data-action="save-ceremony">Save ceremony</button></div></form></div>';
    }

    html += '<div class="final-message"><h2>🏏 MAY THE BEST TEAM SURVIVE!</h2><p>Play hard. Have fun. Blame the captain. And remember — the real trophy is the Biryani. 🍗🏆</p></div>';

    document.getElementById('tab-ceremony').innerHTML = html;
  }

  /* ============================= RENDER ALL ============================= */
  function renderAll(){
    renderHome(); renderSchedule(); renderRules(); renderStats(); renderSurvey(); renderCeremony();
  }

  /* ============================= MUTATIONS / SAVE ============================= */
  function saveData(mutator){
    var next = clone(data);
    mutator(next);
    next.meta.isSample = false;
    if (db && canEdit){
      db.doc('tournament/config').set(next).then(function(){ showToast('Saved ✅'); }).catch(function(err){
        showToast(err && err.code === 'invalid_argument' ? 'You need Editor access to save changes.' : 'Save failed — try again.');
      });
    } else {
      data = next; renderAll();
      showToast(db ? 'You need Editor access to save changes.' : 'Saved locally (preview mode).');
    }
  }

  document.addEventListener('click', function(e){
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var action = btn.dataset.action;
    if (action === 'save-match'){
      var form = document.querySelector('form[data-match="'+btn.dataset.id+'"]');
      var fd = new FormData(form);
      saveData(function(next){
        var m = byId(next.schedule, btn.dataset.id);
        if (!m) return;
        m.label = fd.get('label') || m.label;
        m.datetime = fd.get('datetime') || m.datetime;
        m.teamA = fd.get('teamA') || '';
        m.teamB = fd.get('teamB') || '';
        m.status = fd.get('status') || 'upcoming';
        m.isFinal = !!fd.get('isFinal');
        var aRuns = fd.get('aRuns'), bRuns = fd.get('bRuns');
        if (aRuns !== '' || bRuns !== ''){
          m.result = m.result || {};
          m.result.teamAScore = { runs:num(aRuns), wickets: fd.get('aWkts')!==''?num(fd.get('aWkts')):null, overs: fd.get('aOvers')!==''?num(fd.get('aOvers')):0 };
          m.result.teamBScore = { runs:num(bRuns), wickets: fd.get('bWkts')!==''?num(fd.get('bWkts')):null, overs: fd.get('bOvers')!==''?num(fd.get('bOvers')):0 };
          m.result.winner = fd.get('winner') || '';
          m.result.motm = fd.get('motm') || '';
          m.result.note = fd.get('note') || '';
        }
      });
    }
    if (action === 'save-event'){
      var eform = document.querySelector('form[data-event="'+btn.dataset.id+'"]');
      var efd = new FormData(eform);
      saveData(function(next){
        var ev = byId(next.schedule, btn.dataset.id);
        if (!ev) return;
        ev.label = efd.get('label') || ev.label;
        ev.datetime = efd.get('datetime') || ev.datetime;
        ev.location = efd.get('location') || '';
        ev.description = efd.get('description') || '';
      });
    }
    if (action === 'save-player'){
      var pform = document.querySelector('form[data-player="'+btn.dataset.id+'"]');
      var pfd = new FormData(pform);
      saveData(function(next){
        var p = byId(next.players, btn.dataset.id);
        if (!p) return;
        p.name = pfd.get('name') || p.name; p.team = pfd.get('team') || p.team;
        p.matches = num(pfd.get('matches')); p.runs = num(pfd.get('runs')); p.wickets = num(pfd.get('wickets')); p.ducks = num(pfd.get('ducks'));
      });
    }
    if (action === 'delete-player'){
      saveData(function(next){ next.players = next.players.filter(function(p){ return p.id !== btn.dataset.id; }); });
    }
    if (action === 'add-player'){
      var afd = new FormData(document.getElementById('addPlayerForm'));
      var name = afd.get('name');
      if (!name){ showToast('Enter a player name first.'); return; }
      saveData(function(next){
        next.players.push({ id:'p'+Date.now(), name:name, team:afd.get('team'), matches:num(afd.get('matches')), runs:num(afd.get('runs')), wickets:num(afd.get('wickets')), ducks:num(afd.get('ducks')) });
      });
    }
    if (action === 'save-ceremony'){
      var cfd = new FormData(document.getElementById('ceremonyForm'));
      var fileInput = document.getElementById('celebrationPhotoInput');
      var file = fileInput && fileInput.files && fileInput.files[0];
      function applyFields(next, photo){
        ['champion','runnerUp','playerOfTournament','bestBatter','bestBowler','goldenDuckChampion','captainsExcuse','celebrationNote'].forEach(function(k){
          next.ceremony[k] = cfd.get(k) || '';
        });
        if (photo) next.ceremony.celebrationPhoto = photo;
      }
      if (file && assetsCap){
        assetsCap.upload(file).then(function(res){
          saveData(function(next){ applyFields(next, { id:res.id, url:res.url }); });
        }).catch(function(){ showToast('Photo upload failed — saving text fields only.'); saveData(function(next){ applyFields(next, null); }); });
      } else {
        saveData(function(next){ applyFields(next, null); });
      }
    }
  });
  document.addEventListener('change', function(e){
    if (e.target.dataset && e.target.dataset.highlight){
      var key = e.target.dataset.highlight, val = e.target.value;
      saveData(function(next){ next.highlights[key] = val; });
    }
  });

  var organizerFab = document.getElementById('organizerFab');
  if (organizerFab) organizerFab.addEventListener('click', function(){
    if (db && !canEdit){
      var embedded = window.self !== window.top;
      showToast(embedded
        ? 'Editing is locked in embedded views (e.g. Google Sites) — open this page’s direct claude.ai link instead.'
        : 'Ask the artifact owner to make you an Editor to unlock Organizer Mode.');
      return;
    }
    organizerMode = !organizerMode;
    organizerFab.classList.toggle('active', organizerMode);
    showToast(organizerMode ? 'Organizer Mode on' : 'Organizer Mode off');
    renderAll();
  });

  /* ============================= CAPABILITIES / LIVE DATA ============================= */
  function setConn(state, label){
    var pill = document.getElementById('connPill');
    if (!pill) return;
    pill.classList.toggle('on', state === 'live');
    var lbl = document.getElementById('connLabel');
    if (lbl) lbl.textContent = label;
  }
  function mergeDefaults(remote){
    var base = clone(DEFAULT_DATA);
    if (!remote || typeof remote !== 'object') return base;
    base.meta = Object.assign({}, base.meta, remote.meta||{});
    base.teams = (remote.teams && remote.teams.length) ? remote.teams : base.teams;
    base.schedule = (remote.schedule && remote.schedule.length) ? remote.schedule : base.schedule;
    base.players = remote.players || [];
    base.highlights = Object.assign({}, base.highlights, remote.highlights||{});
    base.ceremony = Object.assign({}, base.ceremony, remote.ceremony||{});
    return base;
  }

  function init(){
    renderAll();
    setTab(location.hash.slice(1) || 'home');

    if (!window.claude || !window.claude.use){
      setConn('offline','Preview mode');
      return;
    }
    Promise.all([
      window.claude.use('db').catch(function(){ return null; }),
      window.claude.use('user').catch(function(){ return null; }),
      window.claude.use('assets').catch(function(){ return null; })
    ]).then(function(res){
      db = res[0]; userCap = res[1]; assetsCap = res[2];
      if (!db){ setConn('offline','Preview mode'); return; }
      setConn('live','Live');

      var afterUser = userCap ? Promise.all([
        userCap.id().catch(function(){ return null; }),
        userCap.canEdit().catch(function(){ return false; }),
        userCap.isOwner().catch(function(){ return false; })
      ]) : Promise.resolve([null,false,false]);

      afterUser.then(function(u){
        myId = u[0]; canEdit = !!u[1]; isOwner = !!u[2];

        db.doc('tournament/config').onSnapshot(function(snap){
          if (snap.exists && snap.data()){
            data = mergeDefaults(snap.data());
          } else {
            data = clone(DEFAULT_DATA);
            if (canEdit) db.doc('tournament/config').set(DEFAULT_DATA).catch(function(){});
          }
          renderAll();
        }, function(){ setConn('offline','Reconnecting…'); });
      });
    });
  }

  init();
})();
</script>
</body>
</html>
